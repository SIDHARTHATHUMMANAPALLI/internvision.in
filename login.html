<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Career Portal</title>
    <link rel="stylesheet" href="assets/css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="brand" href="index.html">AI Career Portal</a>
        <h1>Login</h1>
        <form id="loginForm" class="grid">
            <div>
                <label for="loginEmail">Email</label>
                <input id="loginEmail" type="email" required autocomplete="email">
            </div>
            <div>
                <label for="loginPassword">Password</label>
                <input id="loginPassword" type="password" required autocomplete="current-password">
            </div>
            <button class="btn btn-primary" type="submit">Login</button>
        </form>
        <p class="muted">Don't have an account? <a href="signup.html">Sign up</a></p>
    </main>
    <script src="assets/js/auth.js"></script>
</body>
</html>
